# Server Configuration
server.port=8080

# Application Name
spring.application.name=personal-finance-analyzer

# ==========================================
# Database Configuration (H2 In-Memory - Works Out Of The Box!)
# ==========================================
spring.datasource.url=jdbc:h2:mem:financedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Auto-seed initial SQL demo data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ==========================================
# PostgreSQL Production Configuration:
# To switch back to PostgreSQL, replace the H2 block above with:
# spring.datasource.url=jdbc:postgresql://localhost:5432/finance_db
# spring.datasource.username=postgres
# spring.datasource.password=YOUR_POSTGRES_PASSWORD
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ==========================================

